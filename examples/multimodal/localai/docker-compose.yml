services:
  localai:
    image: localai/localai:v4.7.1@sha256:66c8824a4bd85f24c55c14b916ecac14550c684d64c7b8fcb5000952d665c30a
    restart: unless-stopped
    ports:
      - "${TAILSCALE_IP:?set TAILSCALE_IP to this node's Tailscale IPv4}:8090:8080"
    volumes:
      - ./models:/models:ro
    environment:
      MODELS_PATH: /models
