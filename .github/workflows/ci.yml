name: ci

# Runs the full mesh test suite + catalog validation on every PR and on
# pushes to main. Before this, the only workflow was cross-repo-schema-pin.yml,
# which exercises two targeted files — the other ~580 tests (allocator,
# registry, select, eval runner/gate/seed-verify, grading, quality probe,
# service, dashboard, CLI) never ran in CI, so a PR could break any of them
# and still merge green.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Bound a hung leg: a lock-across-await regression in the spool drain would DEADLOCK
    # the single-threaded event loop synchronously (an in-test `asyncio.wait_for` can't
    # fire — its callback never runs), so cap the job rather than let it hang for hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install core + optional add-on (locked — reproducible from uv.lock)
        # --extra signing pulls PyNaCl so the node-identity (#102), eval-row/seed
        # signature (#104), and peer-challenge (#108) tests RUN in CI. Without it
        # they importorskip and 15 security tests silently pass-by-skipping (#125).
        run: uv sync --all-packages --extra dev --extra signing --frozen --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: uv run --python ${{ matrix.python-version }} ruff check mesh/ packages/slancha-mesh-tune/mesh/

      - name: OSS boundary (no proprietary symbol in mesh source)
        # The usage-telemetry seam (mesh/usage.py) must stay metering-NEUTRAL — a
        # downstream consumer prices + attributes; mesh only counts. This fails the PR
        # if a private-consumer symbol leaks into Apache-2.0 mesh production source.
        # Word-boundary + `.py` + exclude-dir=tests avoids the tokenizer vocab
        # ("prostate") and the boundary-guard test's own explanatory references.
        run: |
          if grep -rnwiI prost mesh/ --include='*.py' --exclude-dir=tests; then
            echo "::error::proprietary symbol leaked into Apache-2.0 mesh source"; exit 1
          fi
          echo "OSS boundary clean"

      - name: Unit + integration tests
        run: uv run --python ${{ matrix.python-version }} pytest -q --tb=short

      - name: Validate catalog (substrate sanity)
        run: uv run --python ${{ matrix.python-version }} python -m mesh.validate_card --strict

      - name: Add-on command smoke
        run: |
          uv run --python ${{ matrix.python-version }} slancha-mesh-tune check
          if uv run --python ${{ matrix.python-version }} slancha-mesh-tune dashboard 2>dashboard.err; then
            echo "::error::dashboard started without its optional extra"; exit 1
          fi
          grep -q 'slancha-mesh-tune\[dashboard\]' dashboard.err

  package-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Build both wheels and source distributions
        run: |
          set -euo pipefail
          mkdir .venv-router
          trap 'rm -rf .venv-router' EXIT
          printf 'must-not-ship\n' > .venv-router/release-artifact-sentinel.txt
          uv build --package slancha-mesh --out-dir dist/core
          uv build --package slancha-mesh-tune --out-dir dist/tune

      - name: Verify release archive contents
        run: python scripts/check_release_artifacts.py dist/core dist/tune

      - name: Validate release metadata
        run: uv run --with twine twine check dist/core/* dist/tune/*

      - name: Prove core has no tuning harness
        run: |
          python -m venv /tmp/slancha-core
          /tmp/slancha-core/bin/pip install dist/core/*.whl
          /tmp/slancha-core/bin/python -c 'import importlib.metadata as metadata; import mesh; assert metadata.version("slancha-mesh") == mesh.__version__ == "0.1.0a1"'
          /tmp/slancha-core/bin/python -c 'import mesh.serve; import importlib.util; assert importlib.util.find_spec("mesh.training") is None'
          ! /tmp/slancha-core/bin/slancha-mesh --help | grep -q loop

      - name: Prove add-on composes with core
        run: |
          unzip -Z1 dist/tune/*.whl | grep -qx LICENSE
          unzip -Z1 dist/tune/*.whl | grep -qx NOTICE
          python -m venv /tmp/slancha-tune
          /tmp/slancha-tune/bin/pip install --find-links "${{ github.workspace }}/dist/core" dist/tune/*.whl
          /tmp/slancha-tune/bin/python -c 'import importlib.metadata as metadata; assert metadata.version("slancha-mesh") == metadata.version("slancha-mesh-tune") == "0.1.0a1"'
          /tmp/slancha-tune/bin/slancha-mesh-tune check
          /tmp/slancha-tune/bin/python -c 'import mesh.training, mesh.eval.gate'

  # The docker/ registry image (the push/central-registry control plane) had
  # no CI coverage — it could bit-rot silently. Build it + smoke the live
  # endpoints so a broken Dockerfile/service boot fails the PR.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build registry image
        run: docker build -t slancha-registry:ci -f docker/Dockerfile .

      - name: Run registry
        run: docker run -d --name reg -p 8088:8088 slancha-registry:ci

      - name: Smoke test (health + clean registry + input validation)
        run: |
          set -e
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/health 2>/dev/null || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          echo "health: $(curl -fsS http://127.0.0.1:8088/health)"
          curl -fsS http://127.0.0.1:8088/health | grep -q '"status":"ok"'
          # A fresh registry must be node-empty but ship the auto-loaded catalog.
          curl -fsS http://127.0.0.1:8088/registry | python3 -c 'import sys, json; s = json.load(sys.stdin)["snapshot"]; assert s["nodes"] == {}, "fresh registry has unexpected nodes: %r" % s["nodes"]; assert len(s.get("catalog", {})) >= 1, "catalog did not auto-load"; print("registry ok: nodes=0 catalog=%d" % len(s["catalog"]))'
          # Malformed heartbeat body must be rejected by pydantic (422), not 500.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8088/heartbeat -H 'content-type: application/json' -d '{"bogus":1}')
          [ "$code" = "422" ] || { echo "expected 422 on junk heartbeat, got $code"; exit 1; }
          echo "docker smoke OK"

      - name: Registry logs on failure
        if: failure()
        run: docker logs reg || true
