[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[project]
name = "slancha-mesh-tune"
version = "0.0.6"
description = "Optional training, replay evaluation, and promotion harness for Slancha-Mesh."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "SlanchaAi", email = "team@slancha.ai"}]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["slancha-mesh==0.0.6"]

[project.urls]
Homepage = "https://github.com/SlanchaAi/slancha-mesh"
Repository = "https://github.com/SlanchaAi/slancha-mesh"
"Bug Tracker" = "https://github.com/SlanchaAi/slancha-mesh/issues"
Documentation = "https://github.com/SlanchaAi/slancha-mesh/tree/main/packages/slancha-mesh-tune"

[project.scripts]
slancha-mesh-tune = "mesh.tune_cli:main"
slancha-mesh-gate = "mesh.eval.gate:main"

[project.optional-dependencies]
train = [
  "torch>=2.2",
  "transformers>=4.40",
  "peft>=0.10",
  "datasets>=2.18",
  "accelerate>=0.29",
]
dashboard = ["streamlit>=1.30"]
loop = ["slancha-local @ git+https://github.com/SlanchaAi/slancha-local"]
signing = ["pynacl>=1.5"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["mesh"]

[tool.hatch.build.targets.wheel.force-include]
"../../LICENSE" = "LICENSE"
"../../NOTICE" = "NOTICE"

[tool.hatch.build.targets.sdist]
include = ["mesh", "README.md", "pyproject.toml"]

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
"../../NOTICE" = "NOTICE"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
slancha-mesh = {workspace = true}

[tool.ruff]
target-version = "py311"
