[build-system]
# Pinned (#144 supply-chain parity): the build backend produces the shipped
# wheel, so an unpinned `hatchling` would let a republished release tamper with
# the build. Bump deliberately alongside the Docker image.
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[project]
name = "slancha-mesh"
version = "0.1.0a1"
description = "Discover, serve, and route local model specialists across a private fleet."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "SlanchaAi", email = "team@slancha.ai"}]
requires-python = ">=3.11"
keywords = ["llm", "inference", "mesh", "routing", "specialist", "vllm", "local-llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Distributed Computing",
]

dependencies = [
  "httpx>=0.27",
  "pydantic>=2.5",
  "fastapi>=0.110",
  "python-multipart>=0.0.29",
  "uvicorn>=0.27",
  "psutil>=5.9",
]

[project.urls]
Homepage = "https://slancha.ai"
Repository = "https://github.com/SlanchaAi/slancha-mesh"
"Bug Tracker" = "https://github.com/SlanchaAi/slancha-mesh/issues"
Documentation = "https://github.com/SlanchaAi/slancha-mesh#readme"
Changelog = "https://github.com/SlanchaAi/slancha-mesh/blob/main/CHANGELOG.md"

[project.scripts]
slancha-mesh = "mesh.cli:main"
slancha-mesh-validate = "mesh.validate_card:main"
mesh-gpu = "mesh.gpu.cli:main"
mesh-doctor = "mesh.scripts.mesh_doctor:main"

[project.optional-dependencies]
serve = [
  "vllm>=0.17",
]
signing = [
  # Ed25519 for node identity (#102) + eval-row/holdout signing (#104). Opt-in:
  # mesh.identity / mesh.eval.seed_verify import it lazily, so the package + the
  # default test suite run without it (those features just stay unavailable).
  #   pip install -e ".[signing]"
  "pynacl>=1.5",
]
classifier = [
  # Classifier-driven `model:"auto"` routing (mesh/classifier/, wired via
  # `slancha-mesh router --auto-route`). Assets (mmBERT-small ONNX INT8 +
  # treelite heads) are vendored in the wheel so this works air-gapped.
  # Opt-in: the router imports it lazily; package + default test suite run
  # without it.
  #   pip install -e ".[classifier]"
  "numpy>=1.26",
  "onnxruntime>=1.17",
  "tokenizers>=0.20",
  "treelite>=4.0",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "jsonschema>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["mesh"]
exclude = ["mesh/tests/**", "mesh/__pycache__/**", "mesh/.runtime/**"]

[tool.hatch.build.targets.wheel.force-include]
"LICENSE" = "LICENSE"
"NOTICE" = "NOTICE"

[tool.hatch.build.targets.sdist]
include = [
  "mesh",
  "README.md",
  "LICENSE",
  "NOTICE",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "pyproject.toml",
]
exclude = [
  ".venv-router/**",
  ".venv/**",
  "venv/**",
  "venv_*/**",
  "env/**",
  "mesh/tests/**",
  "mesh/__pycache__/**",
  "mesh/.runtime/**",
  "**/__pycache__/**",
  "**/.cache/**",
  "**/.pytest_cache/**",
  "**/.ruff_cache/**",
  "**/.mypy_cache/**",
  "packages/**",
  "docs/**",
  "corpus/**",
  "SESSION_LOG*.md",
]

[tool.uv.workspace]
members = ["packages/slancha-mesh-tune"]

[tool.ruff]
# Pin the parse target so the `ruff check mesh/` CI gate behaves the same
# across ruff versions. Default lint rule set (pyflakes + a pycodestyle
# subset) is kept deliberately — broadening `select` is a separate call.
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["mesh/tests"]
